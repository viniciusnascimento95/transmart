<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TranSmart | Logística Inteligente & Transporte de Cargas em Porto Alegre e Região</title>
    
    <!-- SPA redirect restoration for GitHub Pages -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>

    <!-- SEO Meta Tags -->
    <meta name="description" content="TranSmart - Soluções eficientes e seguras no transporte de cargas em Porto Alegre e Região Metropolitana. Frete dedicado, Last Mile, Cross-docking em 24h, Paletização e Distribuição." />
    <meta name="keywords" content="transporte de cargas, logística Porto Alegre, frete dedicado, cross-docking 24h, last mile RS, distribuição de cargas, TranSmart" />
    <meta name="author" content="TranSmart Logística" />
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.transmart.com.br/" />
    <meta property="og:title" content="TranSmart | Logística Inteligente em Porto Alegre" />
    <meta property="og:description" content="Soluções ágeis e seguras no transporte de cargas com atendimento em 24h na Região Metropolitana de Porto Alegre." />
    <meta property="og:image" content="./og-image.jpg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-teal-700 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
